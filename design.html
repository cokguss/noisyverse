<body>

  <canvas id="aurora" aria-hidden="true"></canvas>

  <div class="vignette" aria-hidden="true"></div>

  <header class="legal-nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <svg class="logo-svg" width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="lgn" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#c4b5fd"/>
              <stop offset="0.55" stop-color="#8b5cf6"/>
              <stop offset="1" stop-color="#5b21b6"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#lgn)"/>
          <rect x="3" y="3" width="42" height="42" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
          <path d="M19 17 L12 24 L19 31" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M29 17 L36 24 L29 31" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Noisy<span>Verse</span>
      </a>
      <a href="coba.html" class="btn-back"><i class="ph ph-arrow-left"></i> Kembali ke Reverse</a>
    </div>
  </header>

  <main class="design-page">
    <div class="container">
      <span class="legal-badge">Design System</span>
      <h1 class="try-title">Design <span class="accent-glow">System</span></h1>
      <p class="try-sub" id="dsSubtitle">Spesifikasi desain lengkap hasil reverse — siap dipakai untuk membangun ulang tampilannya.</p>

      <div class="try-card reveal visible">
        <div class="result-head">
          <span class="result-label"><i class="ph-fill ph-palette"></i> <span id="dsSourceLabel">design.md</span></span>
          <div class="result-actions" id="dsActions" hidden>
            <div class="lang-toggle" id="dsLangToggle" role="group" aria-label="Bahasa design">
              <button class="lang-btn active" id="dsLangEn" type="button" data-lang="en">EN</button>
              <button class="lang-btn" id="dsLangId" type="button" data-lang="id">ID</button>
            </div>
            <button class="btn-mini" id="dsCopyBtn" type="button"><i class="ph ph-copy-simple"></i> Salin</button>
            <button class="btn-mini" id="dsDownloadBtn" type="button"><i class="ph ph-download-simple"></i> Unduh</button>
          </div>
        </div>

        <div class="skeleton-md" id="dsSkeleton">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line w90"></div>
          <div class="skeleton-line w80"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line w60"></div>
          <div class="skeleton-line title gap"></div>
          <div class="skeleton-line w90"></div>
          <div class="skeleton-line w80"></div>
          <div class="skeleton-line w60"></div>
        </div>

        <div class="md-body ds-body" id="dsBody" hidden></div>
        <div class="try-error" id="dsError" hidden></div>
      </div>
    </div>
  </main>

  <footer class="legal-footer">
